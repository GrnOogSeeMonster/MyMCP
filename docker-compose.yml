version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mcp_mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--default-authentication-plugin=mysql_native_password","--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${DB_USER} -p${DB_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mcp-network

  migrations:
    build:
      context: ./api
    container_name: mcp_migrations
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["sh", "-c", "/app/scripts/migrate.sh"]
    networks:
      - mcp-network
    restart: "no"

  api:
    build:
      context: ./api
    container_name: mcp_api
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - mcp-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT}:80"
    networks:
      - mcp-network

volumes:
  mysql_data:

networks:
  mcp-network:
    driver: bridge